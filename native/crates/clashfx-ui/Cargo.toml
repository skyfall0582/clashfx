[package]
name = "clashfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "clashfx"

[dependencies]
clashfx-core = { path = "../clashfx-core" }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "windows-manifest"] }
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true
unicode-segmentation = "1"
rfd = "0.17"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Gdi"] }

[build-dependencies]
winresource = "=0.1.34"

